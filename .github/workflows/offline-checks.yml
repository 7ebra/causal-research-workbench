name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Research behavior checks
        run: python -m unittest discover -s research_lab -p "test_*.py"
      - name: Transcript export checks
        run: python -m unittest discover -s tools/chat_export -p "test_*.py"
      - name: Offline synthetic demonstration
        run: python examples/run_demo.py --out demo-output
      - name: Publication boundary checks
        run: python scripts/release_check.py
